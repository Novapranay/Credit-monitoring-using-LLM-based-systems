name: Daily data refresh

# 23:30 UTC, Monday to Friday = 05:00 IST, Tuesday to Saturday.
# That is after the US market close (21:00 UTC in winter, 20:00 UTC in summer) and after
# same-day SEC filings, so each run picks up the previous US trading day.
on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh data and rebuild outputs
        env:
          # SEC asks automated clients to identify themselves. Set the repository variable
          # SEC_USER_AGENT (Settings > Secrets and variables > Actions > Variables) to
          # something like "AI Credit Monitor your-name your-email".
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::Set the SEC_USER_AGENT repository variable (see the comment above) before running this job."
            exit 1
          fi
          python run.py --refresh --require-prices

      - name: Run tests
        run: python -m pytest -q tests

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed output
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Daily data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
